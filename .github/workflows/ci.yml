name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image and smoke-test it against Postgres
        run: |
          docker compose up -d --build --wait
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:3000/health
          docker compose exec -T api node dist/seed.js
          curl --fail http://localhost:3000/weapons
      - if: always()
        run: docker compose down -v
